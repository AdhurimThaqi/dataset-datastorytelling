<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<title>Real or AI? · Live room</title>
<!--
  Projector page for a live round (v8). Open live.html?room=hslu on the big screen: the audience scans the QR code,
  everyone plays the same round on their phone (v8.html?room=hslu), and their player name + score appear here.
  Reads the same Supabase table as the game (only adding and reading are allowed). Click a name to hide it on this screen.
  THIS FILE IS GENERATED from live_template.html by build.py.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="vendor/qrcode.js"></script>
<style>
:root{--bg:#f3f2ed;--panel:#fff;--panel2:#f0eee7;--ink:#14151b;--ink2:#54565f;--muted:#8a8b93;--line:#e2e0d8;--real:#0c9b87;--ai:#7a4ff0;--gold:#d99a00;--good:#16a34a;--bad:#dc2626;
  --display:"Space Grotesk",system-ui,sans-serif;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(20,21,27,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f17;--panel:#161925;--panel2:#1e2232;--ink:#f2f3f8;--ink2:#b4b7c6;--muted:#7d8193;--line:#292d3d;--real:#2dd4bf;--ai:#a78bfa;--gold:#fbbf24}}
:root[data-theme="dark"]{--bg:#0d0f17;--panel:#161925;--panel2:#1e2232;--ink:#f2f3f8;--ink2:#b4b7c6;--muted:#7d8193;--line:#292d3d;--real:#2dd4bf;--ai:#a78bfa;--gold:#fbbf24}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.page{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:clamp(20px,3vw,48px);height:100%;padding:clamp(18px,3vw,44px);max-width:1600px;margin:0 auto}
.left{display:flex;flex-direction:column;gap:18px;justify-content:center}
h1{margin:0;font:700 clamp(40px,5vw,72px)/.95 var(--display);letter-spacing:-.04em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--real),var(--ai));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(18px,1.6vw,24px);color:var(--ink2);margin:0}
.qr{background:#fff;border-radius:24px;padding:18px;box-shadow:var(--shadow);aspect-ratio:1;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.url{font:700 15px/1.3 var(--display);color:var(--muted);word-break:break-all;margin:0}
.room{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.room input{width:130px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-transform:uppercase;font-weight:700}
.right{display:flex;flex-direction:column;gap:16px;min-height:0;justify-content:center}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.head h2{margin:0;font:700 clamp(26px,2.6vw,40px)/1 var(--display);letter-spacing:-.02em;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font:700 18px/1 var(--display)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
.dot.off{background:var(--bad);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:grid;grid-template-columns:56px 1fr auto auto;gap:16px;align-items:center;padding:12px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:clamp(18px,1.7vw,26px);cursor:pointer;transition:transform .4s ease,background .3s}
li .rk{font:700 clamp(22px,2vw,30px)/1 var(--display);color:var(--muted);text-align:center}
li:nth-child(-n+3) .rk{color:var(--gold)}
li .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .sp{font-size:.7em;color:var(--ink2);white-space:nowrap}
li .sc{font:700 clamp(24px,2.3vw,36px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
li.new{animation:flash 1.6s ease}
@keyframes flash{0%{background:color-mix(in srgb,var(--ai) 22%,var(--panel));transform:scale(1.02)}100%{background:var(--panel);transform:none}}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:22px;border:2px dashed var(--line);border-radius:18px}
.tools{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.tools .sp{margin-right:auto}
@media (max-width:900px){.page{grid-template-columns:1fr;height:auto}.qr{max-width:340px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <section class="left" aria-label="Join the game">
    <h1>Real or <em>AI?</em></h1>
    <p class="sub">Scan to play on your phone. Same pictures for everyone, about 4 minutes.</p>
    <div class="qr" id="qr" role="img" aria-label="QR code to open the game"></div>
    <p class="url" id="url"></p>
    <label class="room">Room <input id="roomIn" maxlength="24" aria-label="Room code" spellcheck="false"></label>
  </section>
  <section class="right" aria-label="Room leaderboard">
    <div class="head">
      <h2>Room leaderboard</h2>
      <span class="pill" title="Players in this room">{{i:users}}<span id="count">0</span></span>
      <span class="pill" id="live"><i class="dot" id="dot"></i><span id="liveTxt">Live</span></span>
    </div>
    <ol id="board" aria-live="polite"></ol>
    <div class="empty" id="empty">Waiting for the first scores…</div>
    <div class="tools">
      <span class="sp">Click a name to hide it on this screen.</span>
      <button id="unhide" hidden>{{i:eye-off}}<span id="unhideTxt">Show hidden</span></button>
      <button id="full" title="Fullscreen (F)" aria-label="Fullscreen">{{i:maximize}}</button>
    </div>
  </section>
</div>
<script>
const DB = __ROOM__;
const q = new URLSearchParams(location.search);
if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
const clean = v => (v || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 24);
let room = clean(q.get("room")) || "hslu";
if (room.length < 2) room = "hslu";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hiddenKey = () => "realOrAI.live.hidden." + room;
let hidden = new Set(JSON.parse(localStorage.getItem(hiddenKey()) || "[]")), seen = new Set(), first = true;

function setRoom(r) {
  room = r; hidden = new Set(JSON.parse(localStorage.getItem(hiddenKey()) || "[]")); seen = new Set(); first = true;
  const u = new URL(location.href); u.searchParams.set("room", room); history.replaceState(null, "", u);
  $("#roomIn").value = room.toUpperCase();
  const game = new URL("v8.html", location.href); game.search = "?room=" + room;
  const qr = qrcode(0, "M"); qr.addData(game.toString()); qr.make();
  $("#qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  $("#url").textContent = game.host + game.pathname.replace(/\/[^/]*$/, "/…") + " · room " + room.toUpperCase();
  poll();
}
$("#roomIn").addEventListener("change", e => { const r = clean(e.target.value); if (r.length >= 2) setRoom(r); else e.target.value = room.toUpperCase(); });

async function poll() {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(`${DB.url}/rest/v1/room_scores?room=eq.${room}&select=id,name,score,spotted,of_total&order=score.desc&limit=1000`,
      { headers: { apikey: DB.key }, signal: ctl.signal });
    if (!r.ok) throw new Error(r.status);
    render(await r.json()); $("#dot").classList.remove("off"); $("#liveTxt").textContent = "Live";
  } catch { $("#dot").classList.add("off"); $("#liveTxt").textContent = "Reconnecting…"; }
  finally { clearTimeout(t); }
}
function render(rows) {
  const best = new Map();   // one line per player name: their best round
  rows.forEach(r => { const k = r.name.trim().toLowerCase(); if (!best.has(k) || best.get(k).score < r.score) best.set(k, r); });
  const all = [...best.values()].sort((a, b) => b.score - a.score), shown = all.filter(r => !hidden.has(r.name.trim().toLowerCase()));
  $("#count").textContent = all.length;
  $("#board").innerHTML = shown.slice(0, 10).map((r, i) => {
    const isNew = !first && !seen.has(r.id);
    return `<li class="${isNew ? "new" : ""}" data-k="${esc(r.name.trim().toLowerCase())}" title="Click to hide on this screen"><span class="rk">${i + 1}</span><span class="nm">${esc(r.name)}</span>` +
      `<span class="sp">${r.spotted != null && r.of_total ? `${r.spotted}/${r.of_total} spotted` : ""}</span><span class="sc">${r.score.toLocaleString("en")}</span></li>`;
  }).join("");
  rows.forEach(r => seen.add(r.id)); first = false;
  $("#empty").style.display = shown.length ? "none" : "block";
  $("#unhide").hidden = !hidden.size; $("#unhideTxt").textContent = `Show hidden (${hidden.size})`;
}
$("#board").addEventListener("click", e => {
  const li = e.target.closest("li"); if (!li) return;
  hidden.add(li.dataset.k); localStorage.setItem(hiddenKey(), JSON.stringify([...hidden])); poll();
});
$("#unhide").onclick = () => { hidden.clear(); localStorage.removeItem(hiddenKey()); poll(); };
const full = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
$("#full").onclick = full;
addEventListener("keydown", e => { if ((e.key === "f" || e.key === "F") && e.target.tagName !== "INPUT") full(); });
setRoom(room);
setInterval(poll, 3000);
</script>
</body>
</html>
