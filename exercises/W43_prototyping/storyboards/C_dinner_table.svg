 578.5 l7.2 10.8" stroke="#222" stroke-width="2" fill="none"/><text x="959.0" y="602.8" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Dem</text><circle cx="1024.0" cy="556" r="6.3" fill="none" stroke="#222" stroke-width="2"/><path d="M1024.0 562.3 v16.2 M1015.0 568.6 h18.0 M1024.0 578.5 l-7.2 10.8 M1024.0 578.5 l7.2 10.8" stroke="#222" stroke-width="2" fill="none"/><text x="1024.0" y="602.8" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Rep</text><rect x="794" y="476" width="265" height="46" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="926.5" y="496" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Worried, but it&#x27;s coming anyway.</text><text x="926.5" y="514" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">68% say AI is inevitable</text><text x="758" y="746" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Shared ending</text><text x="758" y="762" font-size="13" font-weight="normal" fill="#555" text-anchor="start">Every branch arrives here.</text></svg>