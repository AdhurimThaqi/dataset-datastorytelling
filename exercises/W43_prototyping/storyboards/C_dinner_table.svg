<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794" font-family="Helvetica,Arial,sans-serif"><rect width="1123" height="794" fill="#fff"/><text x="24" y="36" font-size="22" font-weight="bold" fill="#222" text-anchor="start">C · Dinner table  (branched animatic)</text><text x="24" y="60" font-size="13" font-weight="normal" fill="#555" text-anchor="start">Each character speaks for a survey group; every line is backed by a number from the data.</text><rect x="793" y="18" width="306" height="46" rx="6" fill="#fff4e5" stroke="#eb6834" stroke-width="1.5"/><text x="805" y="37" font-size="12" font-weight="bold" fill="#eb6834" text-anchor="start">DIGITAL REFERENCE, NOT THE MILESTONE</text><text x="805" y="55" font-size="11" font-weight="normal" fill="#555" text-anchor="start">Redraw by hand with a thick pen, then photograph.</text><rect x="24" y="96" width="345" height="280" rx="4" fill="#fff" stroke="#222" stroke-width="2"/><text x="34" y="118" font-size="16" font-weight="bold" fill="#222" text-anchor="start">1</text><rect x="84" y="266" width="225" height="12" fill="#ddd" stroke="#222" stroke-width="2"/><circle cx="99.0" cy="206" r="6.3" fill="none" stroke="#222" stroke-width="2"/><path d="M99.0 212.3 v16.2 M90.0 218.6 h18.0 M99.0 228.5 l-7.2 10.8 M99.0 228.5 l7.2 10.8" stroke="#222" stroke-width="2" fill="none"/><text x="99.0" y="252.8" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Grandma 70</text><circle cx="164.0" cy="206" r="6.3" fill="none" stroke="#222" stroke-width="2"/><path d="M164.0 212.3 v16.2 M155.0 218.6 h18.0 M164.0 228.5 l-7.2 10.8 M164.0 228.5 l7.2 10.8" stroke="#222" stroke-width="2" fill="none"/><text x="164.0" y="252.8" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Student 24</text><circle cx="229.0" cy="206" r="6.3" fill="none" stroke="#222" stroke-width="2"/><path d="M229.0 212.3 v16.2 M220.0 218.6 h18.0 M229.0 228.5 l-7.2 10.8 M229.0 228.5 l7.2 10.8" stroke="#222" stro