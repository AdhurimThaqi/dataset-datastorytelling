<text x="546" y="1094" font-size="13" font-weight="normal" fill="#666" text-anchor="end">leads: audience</text>
<text x="34" y="1116" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">The 18–34 diner talks: concern, excitement and &#x27;none of these&#x27;, then</text>
