<text x="618" y="178" font-size="12" font-weight="normal" fill="#333" text-anchor="start">35–49 79, 50–64 84, 65+ 81 in 100)</text>
<text x="594" y="518" font-size="16" font-weight="bold" fill="#333" text-anchor="start">2 · Shared moment: real or fake</text>
<text x="1106" y="518" font-size="13" font-weight="normal" fill="#666" text-anchor="end">leads: author</text>
<text x="594" y="540" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">Start where everyone agrees: all age bands see people struggling with</text>
<text x="594" y="558" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">real vs fake. No age gap here (all within the margin of error).</text>
<text x="594" y="580" font-size="12" font-weight="normal" fill="#666" text-anchor="start" font-style="italic">Data: ai_community_impact real-fake item, have seen + starting, per age</text>
<text x="594" y="596" font-size="12" font-weight="normal" fill="#666" text-anchor="start" font-style="italic">band.</text>
