<text x="34" y="540" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">Four invented diners, one per age band, plus an empty chair for the</text>
<text x="34" y="558" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">viewer. Every line they say is their group&#x27;s survey number, not a</text>
<text x="34" y="576" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">personal opinion.</text>
<text x="34" y="598" font-size="12" font-weight="normal" fill="#666" text-anchor="start" font-style="italic">Data: subgroups age_18_34 … age_65_plus. Characters are fictional, labelled</text>
<text x="34" y="614" font-size="12" font-weight="normal" fill="#666" text-anchor="start" font-style="italic">as such.</text>
