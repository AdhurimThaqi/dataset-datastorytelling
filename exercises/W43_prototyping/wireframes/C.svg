<text x="1154" y="518" font-size="16" font-weight="bold" fill="#333" text-anchor="start">3 · Branch: whom do you follow?</text>
<text x="1666" y="518" font-size="13" font-weight="normal" fill="#666" text-anchor="end">leads: audience</text>
<text x="1154" y="540" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">Two choices on screen (or two placemats with buttons). No choice for 8</text>
<text x="1154" y="558" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">s → plays 18–34 first, then 65+.</text>
