<text x="58" y="980" font-size="12" font-weight="normal" fill="#333" text-anchor="start">these. 27 in 100 think people like us can shape it, 58 say it&#x27;s</text>
<text x="58" y="996" font-size="12" font-weight="normal" fill="#333" text-anchor="start">coming anyway.&#x27;</text>
